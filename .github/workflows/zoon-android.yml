name: ZOON Android

on:
  workflow_dispatch:
  push:
    branches:
      - zoon-android-app
    paths:
      - 'zoon-android/**'
      - '.github/workflows/zoon-android.yml'
  pull_request:
    paths:
      - 'zoon-android/**'
      - '.github/workflows/zoon-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: zoon-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZOON-Android-debug
          path: zoon-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
