name: ZOON Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - zoon-android-runtime-fix
    paths:
      - 'zoon-android/**'
      - '.github/workflows/zoon-android.yml'
  pull_request:
    paths:
      - 'zoon-android/**'
      - '.github/workflows/zoon-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Lint and build debug APK
        working-directory: zoon-android
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZOON-Android-debug
          path: zoon-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  launch-smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ZOON-Android-debug
          path: /tmp/zoon-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch ZOON on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r /tmp/zoon-apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.quanticsillage.zoon.test
            adb shell am start -W -n com.quanticsillage.zoon.test/com.quanticsillage.zoon.MainActivity
            sleep 8
            echo "=== ZOON process ==="
            adb shell ps -A | grep com.quanticsillage.zoon || true
            echo "=== ZOON activity ==="
            adb shell dumpsys activity activities | grep -A6 -B3 com.quanticsillage.zoon || true
            echo "=== Relevant logcat ==="
            adb logcat -d -v time | grep -E -A20 -B8 "FATAL EXCEPTION|AndroidRuntime|com.quanticsillage.zoon|chromium|WebViewFactory" || true
            adb shell ps -A | grep -q "[c]om.quanticsillage.zoon.test"
            adb shell dumpsys activity activities | grep -q "com.quanticsillage.zoon.test/com.quanticsillage.zoon.MainActivity"
