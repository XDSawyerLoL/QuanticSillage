name: ZOON Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - zoon-product-v2
    paths:
      - 'zoon-android/**'
      - 'zoon/**'
      - 'zoon.html'
      - 'zoon.css'
      - 'zoon-config.js'
      - 'pulse.css'
      - '.github/workflows/zoon-android.yml'
  pull_request:
    paths:
      - 'zoon-android/**'
      - 'zoon/**'
      - 'zoon.html'
      - 'zoon.css'
      - 'zoon-config.js'
      - 'pulse.css'
      - '.github/workflows/zoon-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Lint and build debug APK
        working-directory: zoon-android
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify bundled ZOON product
        run: |
          unzip -l zoon-android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/zoon.html'
          unzip -l zoon-android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/zoon/app.js'
          unzip -l zoon-android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/zoon.css'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZOON-Android-debug
          path: zoon-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  launch-smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZOON API
        run: |
          for attempt in {1..10}; do
            if curl -fsS --max-time 20 https://quantic-pulse-api.onrender.com/api/pulse/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ZOON-Android-debug
          path: /tmp/zoon-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch ZOON on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r /tmp/zoon-apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.quanticsillage.zoon.test
            adb shell am start -W -n com.quanticsillage.zoon.test/com.quanticsillage.zoon.MainActivity
            sleep 10
            adb shell ps -A | grep -q "[c]om.quanticsillage.zoon.test"
            adb shell dumpsys activity activities | grep -q "com.quanticsillage.zoon.test/com.quanticsillage.zoon.MainActivity"
            ! adb logcat -d | grep -E -q "Process: com.quanticsillage.zoon.test|FATAL EXCEPTION.*ZOON"
            adb exec-out screencap -p > /tmp/zoon-screen.png

      - name: Upload Android screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ZOON-Android-screenshot
          path: /tmp/zoon-screen.png
          if-no-files-found: error
