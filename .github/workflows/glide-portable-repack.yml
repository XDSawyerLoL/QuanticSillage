name: Inspect Quantic Glide Portable Package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/glide-portable-repack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-portable:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe release signing credentials
        shell: pwsh
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          Write-Host ("EVS credentials available: " + (-not [string]::IsNullOrWhiteSpace($env:EVS_ACCOUNT_NAME) -and -not [string]::IsNullOrWhiteSpace($env:EVS_PASSWD)))
          Write-Host ("Windows signing credentials available: " + (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)))

      - name: Download current public portable
        shell: pwsh
        run: |
          $url = "https://github.com/XDSawyerLoL/QuanticSillage/releases/download/quantic-glide-v1.2.6/Quantic-Glide-Portable-1.2.6-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile old-portable.exe
          Get-Item old-portable.exe | Format-List Name,Length

      - name: Extract NSIS portable container
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extracted | Out-Null
          7z x old-portable.exe -oextracted -y
          Write-Host "=== TOP LEVEL ==="
          Get-ChildItem extracted | Select-Object Name,Length,Mode | Format-Table -AutoSize
          Write-Host "=== APP/ASAR CANDIDATES ==="
          Get-ChildItem extracted -Recurse -File |
            Where-Object { $_.Name -match 'app.*asar|app-.*\.7z|Quantic.*\.exe|resources' } |
            Select-Object FullName,Length | Format-Table -AutoSize
          Write-Host "=== FIRST 200 FILES ==="
          Get-ChildItem extracted -Recurse -File | Select-Object -First 200 FullName,Length | Format-Table -AutoSize

      - name: Extract packaged application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unpacked | Out-Null
          7z x 'extracted/$PLUGINSDIR/app-64.7z' -ounpacked -y
          Write-Host "=== UNPACKED TOP LEVEL ==="
          Get-ChildItem unpacked | Select-Object Name,Length,Mode | Format-Table -AutoSize
          Write-Host "=== RESOURCE CANDIDATES ==="
          Get-ChildItem unpacked -Recurse -File |
            Where-Object { $_.Name -match 'app\.asar|Quantic.*\.exe|electron\.exe' } |
            Select-Object FullName,Length | Format-Table -AutoSize
          if (!(Test-Path 'unpacked/resources/app.asar')) {
            throw 'resources/app.asar not found in extracted portable application'
          }
          Get-Item 'unpacked/resources/app.asar' | Format-List FullName,Length
