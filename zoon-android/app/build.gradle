plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quanticsillage.zoon'
    compileSdk 36

    defaultConfig {
        applicationId 'com.quanticsillage.zoon'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.2.0'
    }

    signingConfigs {
        debug {
            // Public TEST key committed on purpose so GitHub Actions produces
            // update-compatible debug APKs. Never use this key for Play/release.
            storeFile file('../ci/zoon-test.keystore')
            storePassword 'zoon-test-2026'
            keyAlias 'zoon_test'
            keyPassword 'zoon-test-2026'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
